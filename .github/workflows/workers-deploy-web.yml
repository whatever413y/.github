# Builds a Flutter web app and deploys it as a static-assets Cloudflare Worker (the repo's wrangler.jsonc), checks
# the site serves the new build, then moves the repo's `live` tag to the commit.
# The calling repo needs: environment `production` with secret CLOUDFLARE_API_TOKEN, variables CLOUDFLARE_ACCOUNT_ID
# and API_URL (compiled into the build), and `permissions: contents: write` on the calling job. If the site is behind
# Cloudflare Access: secrets CF_ACCESS_CLIENT_ID / CF_ACCESS_CLIENT_SECRET (a service token the Access policy allows).
name: Deploy a Flutter web app

on:
  workflow_call:
    inputs:
      site-url:
        description: The deployed site's URL, e.g. https://admin.m18-residences.workers.dev
        type: string
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build
        run: |
          test -n "${{ vars.API_URL }}" || { echo "::error::The repo variable API_URL is not set"; exit 1; }
          flutter build web --release --dart-define=API_URL=${{ vars.API_URL }}
          echo "${{ github.sha }}" > build/web/version.txt
      - name: Deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.145.0'
          command: deploy --tag ${{ github.sha }} --message "${{ github.repository }}@${{ github.sha }}"
      - name: Wait until the site serves the new build
        env:
          ACCESS_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          ACCESS_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          headers=()
          if [ -n "$ACCESS_ID" ]; then
            headers=(-H "CF-Access-Client-Id: $ACCESS_ID" -H "CF-Access-Client-Secret: $ACCESS_SECRET")
          fi
          for _ in $(seq 1 30); do
            served=$(curl -fsS "${headers[@]}" "${{ inputs.site-url }}/version.txt" || true)
            if [ "$served" = "${{ github.sha }}" ]; then echo "live: $served"; exit 0; fi
            echo "waiting (got '${served}')"; sleep 5
          done
          echo "::error::${{ inputs.site-url }} never served ${{ github.sha }}"; exit 1
      - name: Move the live tag
        run: |
          git tag -f live "${{ github.sha }}"
          git push -f origin refs/tags/live
