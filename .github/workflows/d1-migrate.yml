# Applies (or lists) a D1 database's pending migrations, from the calling repo's wrangler.jsonc. By default in the
# `production-db` environment (required reviewer): the only path for production schema changes. With
# `environment: development` and `wrangler-env: development` it migrates the development database (no approval).
# The calling repo needs: that environment with secret CLOUDFLARE_API_TOKEN, variable CLOUDFLARE_ACCOUNT_ID.
name: D1 migrations

on:
  workflow_call:
    inputs:
      database:
        description: The D1 database name (as in wrangler.jsonc).
        type: string
        required: true
      command:
        description: '`list` (pending migrations) or `apply`.'
        type: string
        default: list
      environment:
        description: The GitHub environment holding the token (`production-db` waits for approval).
        type: string
        default: production-db
      wrangler-env:
        description: A wrangler environment (`--env`) from wrangler.jsonc; empty = the top-level (production) config.
        type: string
        default: ''

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Check the command
        run: case "${{ inputs.command }}" in list|apply) ;; *) echo "::error::command must be list or apply"; exit 1 ;; esac
      - uses: actions/checkout@v7
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.145.0'
          command: d1 migrations ${{ inputs.command }} ${{ inputs.database }} ${{ inputs.wrangler-env && format('--env {0}', inputs.wrangler-env) || '' }} --remote
